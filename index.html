<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Belajar CSS & Flexbox</title>
    <style>
      body {
        background-color: #eef2f7;
        font-family: Arial, sans-serif;
        color: #333333;
        margin: 0;
        padding: 20px;
      }

      /* MEMBUAT FLEXBOX CONTAINER */
      .container-flex {
        display: flex; /* Mengubah layout jadi fleksibel */
        flex-wrap: wrap; /* Supaya turun ke bawah jika layar penuh */
        gap: 20px; /* Memberikan jarak antar kartu secara otomatis */
      }

      /* Kartu Profil kini menjadi Flex Item */
      .kartu-profil {
        background-color: white;
        padding: 20px;
        border: 2px solid #cbd5e1;
        border-radius: 8px;
        flex: 1; /* Membuat lebar kartu membagi rata ruang */
        min-width: 280px; /* Batas minimal lebar kartu */
      }

      #judul-utama {
        color: #0284c7;
        margin-top: 0;
      }

      table {
        border-collapse: collapse;
        width: 100%;
        background-color: white;
        margin-top: 10px;
      }

      th,
      td {
        border: 1px solid #cbd5e1;
        padding: 10px;
        text-align: left;
      }

      th {
        background-color: #0284c7;
        color: white;
      }
    </style>
  </head>
  <body>
    <!-- Pembungkus utama berfitur Flexbox -->
    <div class="container-flex">
      <!-- Kartu 1 -->
      <div class="kartu-profil">
        <h1 id="judul-utama">Profil Pembelajar Web</h1>
        <p>Halo, saya sedang mempelajari <strong>Flexbox</strong> di CSS.</p>
        <a href="https://github.com" target="_blank">Buka Akun GitHub</a>
      </div>

      <!-- Kartu 2 -->
      <div class="kartu-profil">
        <h2>Status Belajar CSS</h2>
        <table>
          <tr>
            <th>Modul</th>
            <th>Status</th>
          </tr>
          <tr>
            <td>Flexbox Layout</td>
            <td>Sedang Dipelajari</td>
          </tr>
        </table>
      </div>
    </div>
  </body>
</html>
